<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background: Pure White -->
  <rect width="500" height="500" fill="#ffffff" rx="36" />

  <g transform="translate(250, 195)">
    <!-- Magnifying Glass Handle -->
    <line x1="-36" y1="36" x2="-95" y2="95" stroke="#3b3838" stroke-width="26" stroke-linecap="round" />
    <!-- Handle Grip Detail Ring -->
    <line x1="-42" y1="42" x2="-54" y2="54" stroke="#4a4646" stroke-width="28" stroke-linecap="round" />

    <!-- Magnifying Glass Lens Frame with Top Opening -->
    <path 
      d="M -22 -62 A 66 66 0 1 0 22 -62" 
      fill="none" 
      stroke="#3b3838" 
      stroke-width="22" 
      stroke-linecap="round" 
    />

    <!-- Cyan Blue Tie Knot (Top Collar) -->
    <polygon 
      points="-14,-80  14,-80  11,-56  -11,-56" 
      fill="#00a4e4" 
    />

    <!-- Cyan Blue Tie Blade (Body + Pointed Tip) -->
    <polygon 
      points="-11,-54  11,-54  16,14  0,36  -16,14" 
      fill="#00a4e4" 
    />
  </g>

  <!-- Downside Branding: OPPRADAR AI -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Main Title: OPP (Cyan) + RADAR (Dark Charcoal) + AI -->
    <text x="250" y="380" font-size="52" font-weight="900" letter-spacing="-1">
      <tspan fill="#00a4e4">OPP</tspan><tspan fill="#3b3838">RADAR</tspan> <tspan fill="#00a4e4" font-size="44">AI</tspan>
    </text>

    <!-- Subtitle: POWERED BY SAMRAT -->
    <text x="250" y="420" font-size="16" font-weight="800" fill="#4a4646" letter-spacing="6">
      POWERED BY SAMRAT
    </text>
  </g>
</svg>
